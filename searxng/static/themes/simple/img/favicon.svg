<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Eye shape -->
  <ellipse cx="32" cy="32" rx="30" ry="20" 
           stroke="url(#grad)" stroke-width="2.5" fill="none"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="12" fill="url(#grad)"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#0f0f1a"/>
  <!-- Light reflection -->
  <circle cx="28" cy="28" r="2.5" fill="white" opacity="0.8"/>
  <!-- Eyebrow -->
  <path d="M6 16 Q32 2 58 16" 
        stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
