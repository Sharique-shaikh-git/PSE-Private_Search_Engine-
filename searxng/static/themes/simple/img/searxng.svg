<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44B09E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Eye icon -->
  <g transform="translate(15, 15)">
    <!-- Eye outline -->
    <ellipse cx="50" cy="50" rx="48" ry="32" 
             stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <!-- Iris -->
    <circle cx="50" cy="50" r="20" fill="url(#grad2)" opacity="0.9"/>
    <!-- Pupil -->
    <circle cx="50" cy="50" r="9" fill="#0f0f1a"/>
    <!-- Light reflection -->
    <circle cx="43" cy="43" r="4" fill="white" opacity="0.8"/>
    <circle cx="55" cy="55" r="2" fill="white" opacity="0.4"/>
    <!-- Scan line effect -->
    <line x1="10" y1="50" x2="90" y2="50" 
          stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
    <!-- Eyebrow arc -->
    <path d="M10 28 Q50 5 90 28" 
          stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text: PrivateEye -->
  <text x="120" y="78" font-family="Inter, 'Segoe UI', system-ui, sans-serif" 
        font-size="58" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#grad1)">Private</tspan><tspan fill="#ffffff">Eye</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="122" y="105" font-family="Inter, 'Segoe UI', system-ui, sans-serif" 
        font-size="13" font-weight="400" fill="#6b7280" letter-spacing="3">
    YOUR SEARCH. YOUR PRIVACY.
  </text>
</svg>
