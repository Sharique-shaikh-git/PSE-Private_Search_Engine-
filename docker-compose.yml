name: privateeye
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - searxng-network

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./searxng/static/themes/simple/img/searxng.svg:/usr/local/searxng/searx/static/themes/simple/img/searxng.svg:ro
      - ./searxng/static/themes/simple/img/favicon.svg:/usr/local/searxng/searx/static/themes/simple/img/favicon.svg:ro
      - ./searxng/searxng-wordmark.min.svg:/usr/local/searxng/searx/templates/simple/searxng-wordmark.min.svg:ro
      - ./searxng/templates/simple/base.html:/usr/local/searxng/searx/templates/simple/base.html:ro
      - ./searxng/templates/simple/index.html:/usr/local/searxng/searx/templates/simple/index.html:ro
      - ./searxng/templates/simple/search.html:/usr/local/searxng/searx/templates/simple/search.html:ro
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    networks:
      - searxng-network
    depends_on:
      - valkey
      - tor

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    networks:
      - searxng-network

  tor:
    image: dperson/torproxy
    restart: unless-stopped
    ports:
      - "9050:9050"
    networks:
      - searxng-network

volumes:
  caddy_data:
  caddy_config:
  searxng-data:
  valkey-data:

networks:
  searxng-network:
    driver: bridge
